<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A33"/>
      <stop offset="1" stop-color="#F2600C"/>
    </linearGradient>
  </defs>
  <!-- location pin: teardrop shape -->
  <path d="M256 60
           C168 60 100 128 100 216
           C100 320 220 420 256 452
           C292 420 412 320 412 216
           C412 128 344 60 256 60 Z"
        fill="url(#pin)"/>
  <!-- parcel box inside the pin head -->
  <g transform="translate(256 212)">
    <!-- box body -->
    <rect x="-78" y="-48" width="156" height="104" rx="12" fill="#FFFFFF"/>
    <!-- box lid line -->
    <rect x="-78" y="-18" width="156" height="12" fill="#FFE2D0"/>
    <!-- vertical tape -->
    <rect x="-10" y="-48" width="20" height="104" fill="#FFE2D0"/>
    <!-- small handle / flap -->
    <path d="M-30 -48 L0 -22 L30 -48 Z" fill="#FFD4BC"/>
  </g>
</svg>
